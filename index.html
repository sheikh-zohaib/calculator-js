<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="calc">
<input type="text" id="screen" disabled placeholder="0">
<div class="row">
<button class="clear" onclick="calc('C')">C</button>
<button onclick="calc('/')">/</button>
<button onclick="calc('*')">X</button>
<button onclick="calc('-')">-</button>
</div>
<div class="row">
<button onclick="calc('7')">7</button>
<button onclick="calc('8')">8</button>
<button onclick="calc('9')">9</button>
<button onclick="calc('+')">+</button>
</div>
<div class="row">
<button onclick="calc('4')">4</button>
<button onclick="calc('5')">5</button>
<button onclick="calc('6')">6</button>
<button onclick="calc('.')">.</button>
</div>
<div class="row">
<button onclick="calc('1')">1</button>
<button onclick="calc('2')">2</button>
<button onclick="calc('3')">3</button>
<button class="equal" onclick="calc('=')">=</button>
</div>
<div class="row">
<button onclick="calc('0')" style="flex:2;">0</button>
</div>
</div>
<script src="script.js"></script>
</body>
  </html>
